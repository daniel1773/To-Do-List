<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="main.css">
    <script src="app.js" defer></script>
</head>
<body>
    <nav>
        <button id="btn-mudar-tema">Mudar Tema 🌓</button>
    </nav>

    <main>
        <!--Div 1-->
        <div id="div-adicionar-tarefa">
            <h2>Criar tarefas</h2>
            <textarea id="nome_tarefa" placeholder="Ex: Estudar Gastronomia" required></textarea>
            <label>
                <input type="radio" name="prioridade" value="baixa">
                Baixa
            </label>
            <label>
                <input type="radio" name="prioridade" value="média">
                Média
            </label>
            <label>
                <input type="radio" name="prioridade" value="alta">
                Alta
            </label>
            <button id="adicionar_tarefa" onclick="add_tarefa()">Adicionar nova tarefa</button>
            <p id="error"></p>
        </div>

        <!--Div 2-->
        <div id="container">
            <h2>To-Do-List</h2>
            <div id="to-do-list">
                <ul id="tarefas"></ul>
            
            </div>
        </div>

        <!--Div 3-->
        <div id="div-ferramentas">
            <h2>Ferramentas</h2>
            <div>
                <button id="ferramenta-excluir" onclick="ativar_excluir_tarefas()">Excluir uma tarefa</button>
                <!--depois adicionar o botao "renomear tarefa"-->
            </div>
        </div>
    </main>
</body>
</html>
